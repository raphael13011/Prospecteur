const storage = {
  get: async (k) => { const v = localStorage.getItem(k); return v ? { value: v } : null; },
  set: async (k, v) => { localStorage.setItem(k, v); return true; },
  delete: async (k) => { localStorage.removeItem(k); return true; },
};
if (!window.storage) window.storage = storage;

const API_BASE = window.location.origin;

async function api(path, { method = "GET", body, token } = {}) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(API_BASE + "/api" + path, { method, headers, ...(body ? { body: JSON.stringify(body) } : {}) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Erreur " + res.status);
  return data;
}

async function saveToken(t) { try { await window.storage.set("pt", t); } catch {} }
async function loadToken() { try { const r = await window.storage.get("pt"); return r?.value || null; } catch { return null; } }
async function clearToken() { try { await window.storage.delete("pt"); } catch {} }
